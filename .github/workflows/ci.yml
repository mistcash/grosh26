name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install solc
        run: |
          curl -fsSL -o /usr/local/bin/solc "https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux"
          chmod +x /usr/local/bin/solc
          solc --version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The on-chain test compiles and proves the outer circuit twice, so it
      # is the slow part of the suite; it is the only test that -short skips.
      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race -short ./...
