name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Stage only the site: docs/agents/ holds instructions for this repo's
      # own agents and is not part of it.
      - name: stage site
        run: |
          mkdir -p _site
          cp -r docs/assets _site/
          cp docs/*.html docs/llms.txt docs/sitemap.xml docs/robots.txt docs/og.png docs/CNAME _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
