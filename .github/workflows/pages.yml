name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Stage only the site files: docs/agents/ holds internal instructions
      # and is not part of the site.
      - name: stage site
        run: |
          mkdir -p _site
          cp docs/index.html docs/style.css _site/
          cp docs/getting-started.md docs/how-it-works.md \
             docs/benchmarks.md docs/architecture.md _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
