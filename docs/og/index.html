  Source for docs/og.png, the 1200x630 social preview.
  Edit the copy below, then run docs/og/render.sh. Fonts load from Google
  Fonts, so rendering needs network.
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>polyring social preview</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Josefin+Sans:wght@600;700&family=Sen:wght@400;600;800&display=swap">
  <style>
    :root {
      --baby: #e3edf5;
      --mist: #acc4d6;
      --cobalt: #0052ff;
      --ink: #081019;
      --ink-2: #33414f;
      --muted: #5a6b7c;
      --display: "Josefin Sans", sans-serif;
      --text: "Sen", sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background: var(--baby);
      color: var(--ink);
      font-family: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- left ---------- */
    .content {
      position: absolute;
      inset: 0 380px 0 0;
      padding: 54px 64px;
      display: flex;
      flex-direction: column;
    }

    .url {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      font: 500 28px/1 var(--mono);
      color: var(--muted);
    }

    .url::before {
      content: "";
      width: .7em;
      height: .7em;
      border-radius: 1px;
      background: var(--cobalt);
    }

    .mid {
      margin: auto 0 0;
      padding-top: 18px;
    }

    .eyebrow {
      display: block;
      font: 600 35px/1.2 var(--display);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--cobalt);
    }

    h1 {
      margin-top: 20px;
      font: 700 135px/1.1 var(--display);
      letter-spacing: -.03em;
      color: var(--ink);
      margin: 3rem 0 3rem -0.06em;
    }

    .lead {
      margin-top: 30px;
      max-width: 660px;
      font-size: 56px;
      line-height: 1.25;
      color: var(--ink-2);
    }

    /* ---------- side panel ---------- */
    .panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 380px;
      background: var(--cobalt);
      color: #ffffff;
      padding: 42px 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      display: block;
      align-self: stretch;
      width: 90%;
      height: auto;
      color: var(--baby);
      fill: currentColor;
    }

    .big {
      font: 800 125px/.86 var(--text);
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }

    .big-label {
      margin-top: 14px;
      font-size: 70px;
      line-height: 1;
      color: rgba(255, 255, 255, .82);
    }

    .big-label small {
      display: block;
      font-size: 0.52em;
    }

    .bars {
      display: grid;
      gap: 20px;
    }

    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 26px;
      line-height: 1;
    }

    .top .v {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, .82);
    }

    .track {
      position: relative;
      height: 18px;
      margin-top: 9px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .17);
      overflow: hidden;
    }

    .track i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      border-radius: 2px;
      background: var(--mist);
    }

    .track.after i {
      width: 62.05%;
      background: #ffffff;
    }
  </style>
</head>
